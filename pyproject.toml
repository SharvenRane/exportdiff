[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "exportdiff"
version = "0.0.1"
description = "Check whether exporting or quantizing a detector changes per image answers, not just mAP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sharven Rane" }]
requires-python = ">=3.10"
keywords = ["onnx", "onnxruntime", "openvino", "tensorrt", "quantization", "object-detection", "model-export"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10",
]

[project.optional-dependencies]
run = [
    "torch>=2.1",
    "torchvision>=0.16",
    "opencv-python-headless>=4.8",
    "pycocotools>=2.0.7",
    "ultralytics>=8.3",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
openvino = ["openvino>=2024.0", "nncf>=2.10"]
test = ["pytest>=8"]

[project.scripts]
exportdiff = "exportdiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
